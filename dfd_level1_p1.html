<!DOCTYPE html>
<html lang="th">

<head>

    <title>DFD Level 1 - Process 1.0</title>
    <style>

        body {
            margin: 0;
            padding: 30px;
            background: #fff;
            font-family: 'Sarabun', 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center
        }

        h2 {
            font-size: 26px;
            margin-bottom: 8px
        }

        h3 {
            font-size: 20px;
            font-weight: 400;
            margin-top: 0;
            color: #333;
            margin-bottom: 30px
        }

        svg text {
            font-family: 'Sarabun', 'Tahoma', sans-serif

</head>

<body>

        <rect x="1200" y="80" width="150" height="50" fill="#fff" stroke="#000" stroke-width="2" />

        <text x="945" y="485" text-anchor="middle" font-size="15">ดำเนินการ</text>
        <text x="945" y="508" text-anchor="middle" font-size="15">ซ่อม</text>

        <!-- 1.4 -->

        <text x="445" y="608" text-anchor="middle" font-size="15">แจ้งซ่อม</text>

        <line x1="800" y1="950" x2="800" y2="990" stroke="#000" stroke-width="2" />
        <text x="775" y="977" text-anchor="middle" font-size="14" font-weight="700">D2</text>
        <text x="935" y="977" text-anchor="middle" font-size="14">ข้อมูลอาคาร</text>

        <line x1="170" y1="105" x2="328" y2="105" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />

        <!-- 1.1 → หัวหน้างาน (ไปด้านบน) -->
        <line x1="500" y1="100" x2="500" y2="50" stroke="#000" stroke-width="1.5" />
        <line x1="500" y1="50" x2="1275" y2="50" stroke="#000" stroke-width="1.5" />
        <line x1="1275" y1="50" x2="1275" y2="78" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="880" y="42" text-anchor="middle" font-size="14">แจ้งเตือนคำร้องใหม่</text>

        <!-- หัวหน้างาน → 1.2 -->
        <line x1="1200" y1="105" x2="1062" y2="105" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />

        <line x1="470" y1="190" x2="470" y2="298" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />

        <line x1="650" y1="340" x2="650" y2="400" stroke="#000" stroke-width="1.5" />
        <line x1="650" y1="400" x2="945" y2="400" stroke="#000" stroke-width="1.5" />
        <line x1="945" y1="400" x2="945" y2="428" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />

        <text x="216" y="797" text-anchor="middle" font-size="14">ข้อมูลแก้ไข/ลบ</text>
