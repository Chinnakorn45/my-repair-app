<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>DFD Level 1 - Process 2.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap');

        body {
            margin: 0;
            padding: 30px;
            background: #fff;
            font-family: 'Sarabun', 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center
        }

        h2 {
            font-size: 26px;
            margin-bottom: 8px
        }

        h3 {
            font-size: 20px;
            font-weight: 400;
            margin-top: 0;
            color: #333;
            margin-bottom: 30px
        }

        svg text {
            font-family: 'Sarabun', 'Tahoma', sans-serif
        }
    </style>
</head>

<body>
    <h2>แผนภาพกระแสข้อมูลระดับที่ 1</h2>
    <h3>กระบวนการที่ 2.0 การจัดการผู้ใช้งาน</h3>
    <svg width="1300" height="750" viewBox="0 0 1300 750">
        <defs>
            <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0,10 3.5,0 7" fill="#000" />
            </marker>
        </defs>

        <!-- ===== ENTITIES ===== -->
        <rect x="30" y="100" width="140" height="50" fill="#fff" stroke="#000" stroke-width="2" />
        <text x="100" y="132" text-anchor="middle" font-size="18" font-weight="600">ผู้ใช้งาน</text>

        <rect x="30" y="480" width="160" height="50" fill="#fff" stroke="#000" stroke-width="2" />
        <text x="110" y="512" text-anchor="middle" font-size="18" font-weight="600">ผู้ดูแลระบบ</text>

        <!-- ===== PROCESSES ===== -->
        <!-- 2.1 -->
        <rect x="380" y="80" width="240" height="90" fill="#fff" stroke="#000" stroke-width="1.5" />
        <rect x="380" y="80" width="240" height="28" fill="#ddd" stroke="#000" stroke-width="1.5" />
        <text x="500" y="101" text-anchor="middle" font-size="16" font-weight="700">2.1</text>
        <text x="500" y="140" text-anchor="middle" font-size="15">ลงทะเบียนผู้ใช้</text>

        <!-- 2.2 -->
        <rect x="900" y="80" width="240" height="90" fill="#fff" stroke="#000" stroke-width="1.5" />
        <rect x="900" y="80" width="240" height="28" fill="#ddd" stroke="#000" stroke-width="1.5" />
        <text x="1020" y="101" text-anchor="middle" font-size="16" font-weight="700">2.2</text>
        <text x="1020" y="140" text-anchor="middle" font-size="15">เข้าสู่ระบบ</text>

        <!-- 2.3 -->
        <rect x="380" y="460" width="240" height="90" fill="#fff" stroke="#000" stroke-width="1.5" />
        <rect x="380" y="460" width="240" height="28" fill="#ddd" stroke="#000" stroke-width="1.5" />
        <text x="500" y="481" text-anchor="middle" font-size="16" font-weight="700">2.3</text>
        <text x="500" y="520" text-anchor="middle" font-size="15">แสดงข้อมูลผู้ใช้</text>

        <!-- 2.4 -->
        <rect x="900" y="460" width="240" height="90" fill="#fff" stroke="#000" stroke-width="1.5" />
        <rect x="900" y="460" width="240" height="28" fill="#ddd" stroke="#000" stroke-width="1.5" />
        <text x="1020" y="481" text-anchor="middle" font-size="16" font-weight="700">2.4</text>
        <text x="1020" y="520" text-anchor="middle" font-size="15">แก้ไขข้อมูลผู้ใช้</text>

        <!-- ===== DATA STORE D4 ===== -->
        <line x1="520" y1="280" x2="880" y2="280" stroke="#000" stroke-width="2" />
        <line x1="520" y1="320" x2="880" y2="320" stroke="#000" stroke-width="2" />
        <line x1="520" y1="280" x2="520" y2="320" stroke="#000" stroke-width="2" />
        <line x1="570" y1="280" x2="570" y2="320" stroke="#000" stroke-width="2" />
        <text x="545" y="307" text-anchor="middle" font-size="14" font-weight="700">D4</text>
        <text x="725" y="307" text-anchor="middle" font-size="14">ข้อมูลผู้ใช้</text>

        <!-- ===== ARROWS ===== -->

        <!-- ผู้ใช้งาน → 2.1 (ข้อมูลลงทะเบียน) -->
        <line x1="170" y1="110" x2="378" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="274" y="102" text-anchor="middle" font-size="14">ข้อมูลลงทะเบียน</text>

        <!-- 2.1 → ผู้ใช้งาน (ผลลัพธ์) route down to y=155, then left -->
        <line x1="380" y1="155" x2="270" y2="155" stroke="#000" stroke-width="1.5" />
        <line x1="270" y1="155" x2="270" y2="135" stroke="#000" stroke-width="1.5" />
        <line x1="270" y1="135" x2="172" y2="135" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="274" y="165" text-anchor="middle" font-size="14">ผลลัพธ์การลงทะเบียน</text>

        <!-- ผู้ใช้งาน → 2.2 (ชื่อผู้ใช้, รหัสผ่าน) go up to y=40 -->
        <line x1="100" y1="100" x2="100" y2="40" stroke="#000" stroke-width="1.5" />
        <line x1="100" y1="40" x2="1020" y2="40" stroke="#000" stroke-width="1.5" />
        <line x1="1020" y1="40" x2="1020" y2="78" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="560" y="32" text-anchor="middle" font-size="14">ชื่อผู้ใช้, รหัสผ่าน</text>

        <!-- 2.2 → ผู้ใช้งาน (Token) go up to y=60 -->
        <line x1="960" y1="80" x2="960" y2="60" stroke="#000" stroke-width="1.5" />
        <line x1="960" y1="60" x2="130" y2="60" stroke="#000" stroke-width="1.5" />
        <line x1="130" y1="60" x2="130" y2="98" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="545" y="55" text-anchor="middle" font-size="14">Token, บทบาท</text>

        <!-- 2.1 → D4 (บันทึก) x=580 -->
        <line x1="580" y1="170" x2="580" y2="278" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="590" y="230" font-size="14">บันทึกข้อมูลผู้ใช้ใหม่</text>

        <!-- 2.2 → D4 (ตรวจสอบ) x=820 -->
        <line x1="960" y1="170" x2="960" y2="230" stroke="#000" stroke-width="1.5" />
        <line x1="960" y1="230" x2="820" y2="230" stroke="#000" stroke-width="1.5" />
        <line x1="820" y1="230" x2="820" y2="278" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="890" y="222" text-anchor="middle" font-size="14">ตรวจสอบข้อมูลผู้ใช้</text>

        <!-- ผู้ดูแลระบบ → 2.3 -->
        <line x1="190" y1="495" x2="378" y2="495" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="284" y="487" text-anchor="middle" font-size="14">ร้องขอดูข้อมูลผู้ใช้</text>

        <!-- 2.3 → ผู้ดูแลระบบ -->
        <line x1="380" y1="525" x2="192" y2="525" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="286" y="540" text-anchor="middle" font-size="14">รายการข้อมูลผู้ใช้</text>

        <!-- 2.3 → D4 (อ่าน) x=620 -->
        <line x1="620" y1="460" x2="620" y2="322" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="630" y="400" font-size="14">อ่านข้อมูลผู้ใช้</text>

        <!-- ผู้ดูแลระบบ → 2.4 (route below) -->
        <line x1="110" y1="530" x2="110" y2="620" stroke="#000" stroke-width="1.5" />
        <line x1="110" y1="620" x2="1020" y2="620" stroke="#000" stroke-width="1.5" />
        <line x1="1020" y1="620" x2="1020" y2="552" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="565" y="612" text-anchor="middle" font-size="14">ข้อมูลแก้ไขบทบาท</text>

        <!-- 2.4 → D4 (อัปเดต) x=860 -->
        <line x1="960" y1="460" x2="960" y2="370" stroke="#000" stroke-width="1.5" />
        <line x1="960" y1="370" x2="860" y2="370" stroke="#000" stroke-width="1.5" />
        <line x1="860" y1="370" x2="860" y2="322" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="910" y="362" text-anchor="middle" font-size="14">อัปเดตข้อมูลผู้ใช้</text>

        <!-- 2.4 → ผู้ดูแลระบบ (route below via y=660) -->
        <line x1="1080" y1="550" x2="1080" y2="660" stroke="#000" stroke-width="1.5" />
        <line x1="1080" y1="660" x2="70" y2="660" stroke="#000" stroke-width="1.5" />
        <line x1="70" y1="660" x2="70" y2="532" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="575" y="652" text-anchor="middle" font-size="14">ผลลัพธ์การแก้ไข</text>

    </svg>
</body>

</html>
