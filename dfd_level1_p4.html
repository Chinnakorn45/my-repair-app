<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>DFD Level 1 - Process 4.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap');

        body {
            margin: 0;
            padding: 30px;
            background: #fff;
            font-family: 'Sarabun', 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center
        }

        h2 {
            font-size: 26px;
            margin-bottom: 8px
        }

        h3 {
            font-size: 20px;
            font-weight: 400;
            margin-top: 0;
            color: #333;
            margin-bottom: 30px
        }

        svg text {
            font-family: 'Sarabun', 'Tahoma', sans-serif
        }
    </style>
</head>

<body>
    <h2>แผนภาพกระแสข้อมูลระดับที่ 1</h2>
    <h3>กระบวนการที่ 4.0 การจัดการรายงาน</h3>
    <svg width="1300" height="1050" viewBox="0 0 1300 1050">
        <defs>
            <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0,10 3.5,0 7" fill="#000" />
            </marker>
        </defs>

        <!-- === ENTITIES (left side) === -->
        <rect x="30" y="310" width="150" height="55" fill="#fff" stroke="#000" stroke-width="2" />
        <text x="105" y="344" text-anchor="middle" font-size="18" font-weight="600">หัวหน้างาน</text>

        <rect x="650" y="30" width="160" height="50" fill="#fff" stroke="#000" stroke-width="2" />
        <text x="730" y="62" text-anchor="middle" font-size="18" font-weight="600">ผู้ดูแลระบบ</text>

        <!-- === 4 PROCESSES (center column) === -->
        <rect x="370" y="120" width="240" height="90" fill="#fff" stroke="#000" stroke-width="1.5" />
        <rect x="370" y="120" width="240" height="28" fill="#ddd" stroke="#000" stroke-width="1.5" />
        <text x="490" y="141" text-anchor="middle" font-size="16" font-weight="700">4.1</text>

        <rect x="370" y="330" width="240" height="90" fill="#fff" stroke="#000" stroke-width="1.5" />

        <text x="490" y="351" text-anchor="middle" font-size="16" font-weight="700">4.2</text>
        <text x="490" y="390" text-anchor="middle" font-size="15">สรุปการซ่อมตามอาคาร</text>

        <rect x="370" y="560" width="240" height="90" fill="#fff" stroke="#000" stroke-width="1.5" />
        <rect x="370" y="560" width="240" height="28" fill="#ddd" stroke="#000" stroke-width="1.5" />
        <text x="490" y="581" text-anchor="middle" font-size="16" font-weight="700">4.3</text>
        <text x="490" y="620" text-anchor="middle" font-size="15">สรุปผลงานช่างซ่อม</text>

        <rect x="370" y="790" width="240" height="90" fill="#fff" stroke="#000" stroke-width="1.5" />
        <rect x="370" y="790" width="240" height="28" fill="#ddd" stroke="#000" stroke-width="1.5" />
        <text x="490" y="811" text-anchor="middle" font-size="16" font-weight="700">4.4</text>
        <text x="490" y="850" text-anchor="middle" font-size="15">แสดงแนวโน้มรายเดือน</text>

        <!-- === DATA STORES (right side, each next to its process) === -->
        <!-- D1 shown 4 times (valid DFD notation for shared data stores) -->
        <!-- D1 for 4.1 -->
        <line x1="830" y1="145" x2="1100" y2="145" stroke="#000" stroke-width="2" />
        <line x1="830" y1="180" x2="1100" y2="180" stroke="#000" stroke-width="2" />
        <line x1="830" y1="145" x2="830" y2="180" stroke="#000" stroke-width="2" />
        <line x1="880" y1="145" x2="880" y2="180" stroke="#000" stroke-width="2" />
        <text x="855" y="169" text-anchor="middle" font-size="13" font-weight="700">D1</text>
        <text x="990" y="169" text-anchor="middle" font-size="13">ข้อมูลคำร้องแจ้งซ่อม</text>

        <!-- D1 for 4.2 -->
        <line x1="830" y1="345" x2="1100" y2="345" stroke="#000" stroke-width="2" />
        <line x1="830" y1="380" x2="1100" y2="380" stroke="#000" stroke-width="2" />
        <line x1="830" y1="345" x2="830" y2="380" stroke="#000" stroke-width="2" />
        <line x1="880" y1="345" x2="880" y2="380" stroke="#000" stroke-width="2" />
        <text x="855" y="369" text-anchor="middle" font-size="13" font-weight="700">D1</text>
        <text x="990" y="369" text-anchor="middle" font-size="13">ข้อมูลคำร้องแจ้งซ่อม</text>

        <!-- D2 for 4.2 -->
        <line x1="830" y1="400" x2="1100" y2="400" stroke="#000" stroke-width="2" />
        <line x1="830" y1="435" x2="1100" y2="435" stroke="#000" stroke-width="2" />
        <line x1="830" y1="400" x2="830" y2="435" stroke="#000" stroke-width="2" />
        <line x1="880" y1="400" x2="880" y2="435" stroke="#000" stroke-width="2" />
        <text x="855" y="424" text-anchor="middle" font-size="13" font-weight="700">D2</text>
        <text x="990" y="424" text-anchor="middle" font-size="13">ข้อมูลอาคาร</text>

        <!-- D1 for 4.3 -->
        <line x1="830" y1="575" x2="1100" y2="575" stroke="#000" stroke-width="2" />
        <line x1="830" y1="610" x2="1100" y2="610" stroke="#000" stroke-width="2" />
        <line x1="830" y1="575" x2="830" y2="610" stroke="#000" stroke-width="2" />
        <line x1="880" y1="575" x2="880" y2="610" stroke="#000" stroke-width="2" />
        <text x="855" y="599" text-anchor="middle" font-size="13" font-weight="700">D1</text>
        <text x="990" y="599" text-anchor="middle" font-size="13">ข้อมูลคำร้องแจ้งซ่อม</text>

        <!-- D4 for 4.3 -->
        <line x1="830" y1="630" x2="1100" y2="630" stroke="#000" stroke-width="2" />
        <line x1="830" y1="665" x2="1100" y2="665" stroke="#000" stroke-width="2" />
        <line x1="830" y1="630" x2="830" y2="665" stroke="#000" stroke-width="2" />
        <line x1="880" y1="630" x2="880" y2="665" stroke="#000" stroke-width="2" />
        <text x="855" y="654" text-anchor="middle" font-size="13" font-weight="700">D4</text>
        <text x="990" y="654" text-anchor="middle" font-size="13">ข้อมูลผู้ใช้</text>

        <!-- D1 for 4.4 -->
        <line x1="830" y1="820" x2="1100" y2="820" stroke="#000" stroke-width="2" />
        <line x1="830" y1="855" x2="1100" y2="855" stroke="#000" stroke-width="2" />
        <line x1="830" y1="820" x2="830" y2="855" stroke="#000" stroke-width="2" />
        <line x1="880" y1="820" x2="880" y2="855" stroke="#000" stroke-width="2" />
        <text x="855" y="844" text-anchor="middle" font-size="13" font-weight="700">D1</text>
        <text x="990" y="844" text-anchor="middle" font-size="13">ข้อมูลคำร้องแจ้งซ่อม</text>

        <!-- ======================================= -->
        <!-- LEFT: Entity ↔ Process (x=30-350 zone) -->
        <!-- ======================================= -->

        <!-- หัวหน้างาน → 4.1 at x=310 -->
        <line x1="180" y1="320" x2="310" y2="320" stroke="#000" stroke-width="1.5" />
        <line x1="310" y1="320" x2="310" y2="160" stroke="#000" stroke-width="1.5" />
        <line x1="310" y1="160" x2="368" y2="160" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="315" y="230" font-size="14">ร้องขอดูสถิติ</text>

        <!-- 4.1 → หัวหน้างาน at x=190, exit at y=140 (above x=310 turn) -->
        <line x1="370" y1="140" x2="190" y2="140" stroke="#000" stroke-width="1.5" />
        <line x1="190" y1="140" x2="190" y2="310" stroke="#000" stroke-width="1.5" />
        <line x1="190" y1="310" x2="182" y2="310" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="180" y="230" font-size="14" text-anchor="end">ข้อมูลสถิติสรุป</text>

        <!-- หัวหน้างาน → 4.2 -->
        <line x1="180" y1="340" x2="368" y2="340" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="274" y="334" text-anchor="middle" font-size="14">ร้องขอรายงาน</text>

        <!-- 4.2 → หัวหน้างาน -->
        <line x1="370" y1="400" x2="250" y2="400" stroke="#000" stroke-width="1.5" />
        <line x1="250" y1="400" x2="250" y2="367" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="274" y="414" text-anchor="middle" font-size="14">จำนวนการซ่อมต่ออาคาร</text>

        <!-- หัวหน้างาน → 4.3 at x=145 -->
        <line x1="145" y1="365" x2="145" y2="590" stroke="#000" stroke-width="1.5" />
        <line x1="145" y1="590" x2="368" y2="590" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="257" y="583" text-anchor="middle" font-size="14">ร้องขอดูผลงานช่าง</text>

        <!-- 4.3 → หัวหน้างาน at x=110 -->
        <line x1="370" y1="625" x2="110" y2="625" stroke="#000" stroke-width="1.5" />
        <line x1="110" y1="625" x2="110" y2="367" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="240" y="638" text-anchor="middle" font-size="14">ผลงานช่างซ่อม</text>

        <!-- หัวหน้างาน → 4.4 at x=75 -->
        <line x1="75" y1="365" x2="75" y2="820" stroke="#000" stroke-width="1.5" />
        <line x1="75" y1="820" x2="368" y2="820" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="222" y="813" text-anchor="middle" font-size="14">ร้องขอดูแนวโน้ม</text>

        <!-- 4.4 → หัวหน้างาน at x=40 -->
        <line x1="370" y1="855" x2="40" y2="855" stroke="#000" stroke-width="1.5" />
        <line x1="40" y1="855" x2="40" y2="367" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="205" y="868" text-anchor="middle" font-size="14">กราฟแนวโน้มรายเดือน</text>

        <!-- ผู้ดูแลระบบ → 4.1 -->
        <line x1="730" y1="80" x2="730" y2="100" stroke="#000" stroke-width="1.5" />
        <line x1="730" y1="100" x2="490" y2="100" stroke="#000" stroke-width="1.5" />
        <line x1="490" y1="100" x2="490" y2="118" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="610" y="93" text-anchor="middle" font-size="14">ร้องขอดูสถิติ</text>

        <!-- ========================================== -->
        <!-- RIGHT: Process → DataStore (ALL HORIZONTAL) -->
        <!-- Each line is simple horizontal, NO routing  -->
        <!-- ========================================== -->

        <!-- 4.1 → D1 -->
        <line x1="610" y1="160" x2="828" y2="160" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="720" y="153" text-anchor="middle" font-size="14">อ่านข้อมูลคำร้อง</text>

        <!-- 4.2 → D1 -->
        <line x1="610" y1="360" x2="828" y2="360" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="720" y="353" text-anchor="middle" font-size="14">อ่านข้อมูลคำร้อง</text>

        <!-- 4.2 → D2 -->
        <line x1="610" y1="415" x2="828" y2="415" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="720" y="408" text-anchor="middle" font-size="14">อ่านข้อมูลอาคาร</text>

        <!-- 4.3 → D1 -->
        <line x1="610" y1="590" x2="828" y2="590" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="720" y="583" text-anchor="middle" font-size="14">อ่านข้อมูลคำร้อง</text>

        <!-- 4.3 → D4 -->
        <line x1="610" y1="645" x2="828" y2="645" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="720" y="638" text-anchor="middle" font-size="14">อ่านข้อมูลช่างซ่อม</text>

        <!-- 4.4 → D1 -->
        <line x1="610" y1="835" x2="828" y2="835" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" />
        <text x="720" y="828" text-anchor="middle" font-size="14">อ่านข้อมูลตามเดือน</text>

    </svg>
</body>

</html>
